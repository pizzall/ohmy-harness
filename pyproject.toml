[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ohmyagent"
version = "2.0.0"
description = "Local task and review ledger for the ohmy-harness skill"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = []

[project.scripts]
oma = "ohmyagent.cli:main"

[tool.setuptools.packages.find]
where = ["ohmy-harness/scripts"]
include = ["ohmyagent*"]
